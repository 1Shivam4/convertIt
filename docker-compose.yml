services:
  # Gotenberg API Container - Chromium/LibreOffice PDF conversion engine
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: convertit-gotenberg
    ports:
      - "8000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - In-memory cache, rate limiting, BullMQ queue & daily quota store
  redis:
    image: redis:7-alpine
    container_name: convertit-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:



